<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat exchange</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,Arial,sans-serif;color:#171717;background:white}
.wrap{max-width:760px;margin:auto;border:1px solid #ddd;border-radius:14px;padding:16px}
.controls{margin:10px 0 18px}
.top{display:flex;justify-content:flex-start;align-items:center;font-weight:600}
.trackzone{margin-left:17.14%;margin-right:5%}
input{width:100%;margin:14px 0 7px;accent-color:#777}
.ends{display:flex;justify-content:space-between;color:#666;font-size:14px;margin-bottom:8px}
.section{margin:18px 0 24px}
h2{font-size:24px;margin:0 0 8px 18px}
.diagram{width:100%;height:auto;display:block}
.temp{font-size:19px;font-weight:500}
.delta{font-size:18px;font-weight:700}
.local{font-size:16px}
.lane{font-size:19px}
.guide{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5}
@media(max-width:480px){.wrap{padding:12px}h2{font-size:20px}.temp{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
 <div id="concurrent"></div>
 <div class="controls">
  <div class="trackzone">
   <input id="slider" aria-label="Position along the exchanger" type="range" min="0" max="100" value="50" step="1">
  </div>
 </div>
 <div id="countercurrent"></div>
</div>
<script>
const rows={
 concurrent:{title:'Concurrent - theoretical', artery:[30,30,30,30,31,33], vein:[30,30,30,30,29,27], topLabel:'H', bottomLabel:'L'},
 countercurrent:{title:'Countercurrent', artery:[33,32,31,30,29,28], vein:[32,31,30,29,28,27], topLabel:'Artery', bottomLabel:'Vein'}
};
function at(a,p){const n=p*5,k=Math.min(4,Math.floor(n)),t=n-k;return a[k]*(1-t)+a[k+1]*t}
function label(v){return (Math.round(v*10)/10).toFixed(Math.abs(v-Math.round(v))<.05?0:1)+'°C'}
const slider=document.getElementById('slider');
function sectionHTML(r,p){
 const a=at(r.artery,p),v=at(r.vein,p);
 return `<section class="section"><h2>${r.title}</h2><svg class="diagram" viewBox="0 0 700 228" role="img" aria-label="${r.title}: artery ${label(a)}, vein ${label(v)}, local difference ${label(a-v)}">
 <text x="16" y="57" class="lane" fill="#bf5954">${r.topLabel}</text><text x="16" y="155" class="lane" fill="#4387c6">${r.bottomLabel}</text>
 <line x1="120" y1="48" x2="665" y2="48" stroke="#c75e57" stroke-width="5"/>
 <line x1="120" y1="148" x2="665" y2="148" stroke="#4387c6" stroke-width="5"/>
 <line x1="${120+p*545}" y1="18" x2="${120+p*545}" y2="181" class="guide"/>
 <text x="${120+p*545}" y="30" text-anchor="middle" class="temp" fill="#c75e57">${label(a)}</text>
 <text x="${120+p*545}" y="179" text-anchor="middle" class="temp" fill="#4387c6">${label(v)}</text>
 <rect x="245" y="66" width="295" height="65" rx="13" fill="#f4f4f4"/>
 <text x="392" y="91" text-anchor="middle" class="local">Local difference</text>
 <text x="392" y="116" text-anchor="middle" class="delta">${label(a-v)}</text>
 <text x="120" y="214" text-anchor="start" fill="#666" font-size="15">${r.title.startsWith('Concurrent')?'Equilibrium':'Body core'}</text>
 <text x="665" y="214" text-anchor="end" fill="#666" font-size="15">${r.title.startsWith('Concurrent')?'Initial':'Body extremity'}</text>
 </svg></section>`
}
function draw(){
 const p=+slider.value/100;
 document.getElementById('concurrent').innerHTML=sectionHTML(rows.concurrent,p);
 document.getElementById('countercurrent').innerHTML=sectionHTML(rows.countercurrent,p);
}
slider.addEventListener('input',draw);draw();
</script>
</body>
</html>
