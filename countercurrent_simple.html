<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat exchange</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial,sans-serif;color:#171717;background:white}.wrap{max-width:760px;margin:auto;border:1px solid #ddd;border-radius:14px;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}#percent{font-weight:400;color:#666}input{width:100%;margin:14px 0 7px;accent-color:#777}.ends{display:flex;justify-content:space-between;color:#666;font-size:14px;margin-bottom:20px}.section{margin:18px 0 30px}h2{font-size:24px;margin:0 0 8px 18px}.diagram{width:100%;height:auto;display:block}.foot{font-size:12px;color:#666;margin:0}.temp{font-size:19px;font-weight:500}.delta{font-size:18px;font-weight:700}.local{font-size:16px}.lane{font-size:19px}.guide{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5} @media(max-width:480px){.wrap{padding:12px}h2{font-size:20px}.temp{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><label for="slider">Position along the exchanger</label><span id="percent">50%</span></div>
 <input id="slider" type="range" min="0" max="100" value="50" step="1">
 <div class="ends"><span>Body core</span><span>Body extremity</span></div>
 <div id="charts"></div>
</div>
<script>
const rows=[
 {title:'Concurrent - theoretical; not physiologically accurate', artery:[33,31,30,30,30,30],vein:[27,29,30,30,30,30]},
 {title:'Countercurrent',artery:[33,32,31,30,29,28],vein:[32,31,30,29,28,27]}
];
// Piecewise interpolation between six locations, preserving the source figure's numbers.
function at(a,p){const n=p*5,k=Math.min(4,Math.floor(n)),t=n-k;return a[k]*(1-t)+a[k+1]*t}
function label(v){return (Math.round(v*10)/10).toFixed(Math.abs(v-Math.round(v))<.05?0:1)+'°C'}
const slider=document.getElementById('slider'),charts=document.getElementById('charts');
function draw(){let p=+slider.value/100;document.getElementById('percent').textContent=slider.value+'%';charts.innerHTML=rows.map(r=>{
 const a=at(r.artery,p),v=at(r.vein,p),x=54+p*596;
 return `<section class="section"><h2>${r.title}</h2><svg class="diagram" viewBox="0 0 700 195" role="img" aria-label="${r.title}: artery ${label(a)}, vein ${label(v)}, local difference ${label(a-v)}">
 <text x="16" y="57" class="lane" fill="#bf5954">Artery</text><text x="16" y="155" class="lane" fill="#4387c6">Vein</text>
 <line x1="120" y1="48" x2="665" y2="48" stroke="#c75e57" stroke-width="5"/>
 <line x1="120" y1="148" x2="665" y2="148" stroke="#4387c6" stroke-width="5"/>
 <line x1="${120+p*545}" y1="18" x2="${120+p*545}" y2="181" class="guide"/>
 <text x="${120+p*545}" y="30" text-anchor="middle" class="temp" fill="#c75e57">${label(a)}</text>
 <text x="${120+p*545}" y="179" text-anchor="middle" class="temp" fill="#4387c6">${label(v)}</text>
 <rect x="245" y="66" width="295" height="65" rx="13" fill="#f4f4f4"/>
 <text x="392" y="91" text-anchor="middle" class="local">Local difference</text>
 <text x="392" y="116" text-anchor="middle" class="delta">${label(a-v)}</text>
 </svg></section>`}).join('')}
slider.addEventListener('input',draw);draw();
</script>
</body>
</html>
